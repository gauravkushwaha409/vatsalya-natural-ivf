services:
  vatsalya-fe:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: https://api.vatsalya.com.np/api/v1
        NODE_ENV: ${NODE_ENV}
    container_name: vatsalya-fe
    ports:
      - "8001:3000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NODE_ENV=${NODE_ENV}
    extra_hosts:
      - "api.vatsalya.com.np:172.17.0.1"
    networks:
      - vatsalya-network
    restart: always

networks:
  vatsalya-network:
    external: true
