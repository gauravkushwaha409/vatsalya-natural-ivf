version: '3.8'

services:
  vatsalya-fe:
    image: vatsalya-fe:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      # Configure longer request timeouts
      - AXIOS_TIMEOUT=30000
      - FETCH_TIMEOUT=30000
      - NEXT_TELEMETRY_DISABLED=1
    networks:
      - vatsalya-network

networks:
  vatsalya-network:
    external: true
