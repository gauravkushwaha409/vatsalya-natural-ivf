services:
  vatsalya-fe-prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: https://api.vatsalya.com.np/api/v1
        NODE_ENV: production
    container_name: vatsalya-fe-prod
    ports:
      - "8002:3000"
    env_file:
      - .env.prod
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.vatsalya.com.np/api/v1}
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - vatsalya-network-prod
    # deploy:
    #   replicas: 2
    #   update_config:
    #     parallelism: 1
    #     delay: 10s
    #     order: start-first
    #   restart_policy:
    #     condition: any
    #     delay: 5s
    #     max_attempts: 3
    #     window: 120s
    restart: always

networks:
  vatsalya-network-prod:
    name: vatsalya-network-prod
    external: true 